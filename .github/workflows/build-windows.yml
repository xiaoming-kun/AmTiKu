name: build-windows

# 免安装版（PyInstaller）：在云端 Windows 上编译，产物是可直接双击的 AmTiKu.exe。
# 为什么放 Actions：PyInstaller 不能跨平台编译，本机是 macOS 编不出 Windows exe。
on:
  workflow_dispatch:          # 手动触发（网页按钮或 gh workflow run）
  push:
    tags: ['v*']              # 打标签时自动出包 + 发 Releases

permissions:
  contents: write             # 建 Release、传资产要用

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 版本号只有一个来源：仓库根的 `VERSION`。产物名、Release 标题都用它，
      # 避免"tag 是 v2.0.0、文件名里写 1.9.3"这种对不上。
      - name: 读版本号
        id: ver
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # web/dist 是构建产物、不在仓库里（已 gitignore），必须现场构建，
      # 否则 PyInstaller 会报 Unable to find '...\web\dist' 而失败（第一次就踩了）
      - name: 构建前端
        working-directory: web
        run: |
          npm ci
          npm run build

      # ── 内置 LaTeX：最小 TeX Live + 本项目需要的宏包 ─────────────────
      # 为什么不用 Tectonic：它要另验 exam-zh/中文兼容性；TeX Live 与开发机同一套引擎，零风险。
      # 装到 dist\tex（ASCII 路径——install-tl 是 perl 脚本，中文路径会读成乱码，踩过）。
      # ── 优先用"预装好的 TeX"（Release 附件）────────────────────────
      # 从 CTAN 装一遍最小 TeX Live + 补 ~90 个宏包要 10~20 分钟，而这份 TeX
      # 内容一样（包清单已比对过）、只要下载 ~271MB（约 1 分钟）。
      # 下载失败才回退到"自己装"那三步（continue-on-error + outcome 判断）。
      - name: 下载预装好的 TeX（快 10 倍）
        id: pretex
        shell: pwsh
        continue-on-error: true
        run: |
          $url = "https://github.com/xiaoming-kun/AmTiKu/releases/download/v0.1.0/AmTiKu-Windows-tex.zip"
          Invoke-WebRequest -Uri $url -OutFile tex.zip -TimeoutSec 900
          Expand-Archive tex.zip -DestinationPath tex -Force
          Move-Item tex.zip AmTiKu-Windows-tex.zip -Force
          Write-Host "已使用预装 TeX（跳过从 CTAN 安装）"

      # TeX 装一次要 5 分钟、补宏包又要 5 分钟——而 GitHub 每轮都给全新的机器，
      # 所以缓存 tex/ 目录：第二轮起这两步直接跳过（10 分钟 → 秒级）。
      # 换了宏包清单要改 key（-v2、-v3…）以刷新缓存。
      # 拆成 restore/save 两步：save 用 if: always()，否则任务一失败就不保存，
      # 于是每轮都从零装 TeX（12 轮里有 12 次慢，就是这个原因）。
      - name: 恢复 TeX 缓存
        if: steps.pretex.outcome != 'success'
        id: texcache
        uses: actions/cache/restore@v4
        with:
          path: tex
          key: texlive-windows-2026-v2

      - name: 安装内置 LaTeX（最小 TeX Live）
        if: steps.pretex.outcome != 'success' && steps.texcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # mirror.ctan.org 只是个重定向器，指向的镜像偶尔连不上（CI 上连挂两次）。
          # 多个镜像逐个试，并给足超时与重试。
          $mirrors = @(
            'https://mirrors.tuna.tsinghua.edu.cn/CTAN',
            'https://mirror.ctan.org',
            'https://mirror-hk.koddos.net/CTAN'
          )
          $ok = $false
          foreach ($m in $mirrors) {
            try {
              Write-Host "尝试镜像 $m"
              Invoke-WebRequest -Uri "$m/systems/texlive/tlnet/install-tl.zip" -OutFile install-tl.zip -TimeoutSec 600
              $ok = $true; break
            } catch { Write-Host "  失败：$($_.Exception.Message)" }
          }
          if (-not $ok) { throw "所有 CTAN 镜像都下载失败" }
          Expand-Archive install-tl.zip -DestinationPath tlinst -Force
          $d = (Get-ChildItem tlinst -Directory | Select-Object -First 1).FullName
          $tex = Join-Path $PWD "tex"
          @"
          selected_scheme scheme-minimal
          TEXDIR $tex
          TEXMFLOCAL $tex\texmf-local
          TEXMFSYSVAR $tex\texmf-var
          TEXMFSYSCONFIG $tex\texmf-config
          TEXMFVAR $tex\texmf-var
          TEXMFCONFIG $tex\texmf-config
          TEXMFHOME $tex\texmf-home
          instopt_portable 1
          instopt_adjustpath 0
          instopt_adjustrepo 0
          tlpdbopt_install_docfiles 0
          tlpdbopt_install_srcfiles 0
          "@ | Out-File -Encoding ascii tl.profile
          & "$d\install-tl-windows.bat" -profile tl.profile -no-interaction
          & "$tex\bin\windows\tlmgr.bat" option repository https://mirrors.tuna.tsinghua.edu.cn/CTAN/systems/texlive/tlnet
          & "$tex\bin\windows\tlmgr.bat" install xetex exam-zh ctex xecjk unicode-math newcomputermodern stix2-otf asana-math fandol tex-gyre elegantnote elegantbook makecell pgfplots siunitx varwidth tikzpagenodes environ trimspaces

      # 宏包清单靠猜必然漏（本机就漏在 l3draw.sty 上），所以用项目自带的补包工具：
      # 反复编译参考卷 → 缺哪个包就 tlmgr 装哪个 → 直到编出 PDF。本机与 CI 共用同一逻辑。
      - name: 铺好参考卷要用的图片
        shell: pwsh
        run: |
          # 参考卷里那道题带图（demo 的抛物线图），CI 里没有 图片/ 目录，
          # 缺图会让 -halt-on-error 直接判失败
          if (!(Test-Path 图片)) { New-Item -ItemType Directory 图片 | Out-Null }
          Copy-Item demo数据\图片\* 图片\ -Force

      - name: 补全 TeX 宏包（编参考卷自检，缓存命中也会跑一遍兜底）
        run: python packaging/tex_complete.py --tex tex --papers packaging/test-paper.tex packaging/test-handout.tex
        # 两篇都要编：试卷走 exam-zh、A4 讲义走 elegantnote，
        # 只编一种就会出现"另一种卷型从没被验证过"（elegantnote.cls 就是这么漏的）

      # 保存必须在 TeX 装完之后（放前面会存进一个空/残缺的树，还会让后续轮次
      # 误命中缓存而跳过安装 —— 我第一次就把它放前面了，结果缓存形同虚设）
      - name: 保存 TeX 缓存（无论成败）
        if: always() && steps.texcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tex
          key: texlive-windows-2026-v2

      - name: PyInstaller 打包
        shell: pwsh
        run: |
          # --paths . 必须加：入口在 packaging/ 下，不加的话分析时 sys.path 只有该目录，
          # amti 包不在搜索路径上，打出来的 exe 会 ModuleNotFoundError（踩过）
          pyinstaller --noconfirm --console --name AmTiKu --paths . `
            --add-data "web/dist;web/dist" `
            --add-data "demo数据;demo数据" `
            --collect-all fitz --collect-all PIL --collect-all numpy `
            packaging/amti_frozen.py

      - name: 冒烟测试（用包内 demo 题真编一份 PDF）
        shell: pwsh
        run: |
          # 要点：**在 exe 所在目录里跑**，这样 ROOT=exe 目录 → 用包内 demo 题库
          # （仓库里没有题库，指向仓库根会让自检"跳过导出"，等于没验 —— 上一轮就是这样）
          # TeX 直接**解压**到 exe 旁边；不要用 Copy-Item：TeX 树里有符号链接，
          # PowerShell 的递归拷贝对符号链接处理不可靠。
          #
          # ⚠️ **这里以前只认「下载下来的预装 zip」，是三次 tag 构建全部失败的根因**：
          #    那个资产在 v0.1.0 里并不存在（URL 404），而下载步骤 continue-on-error，
          #    于是静默没有 zip、到这里 Expand-Archive 直接退 1 —— 冒烟没跑、Release 没出，
          #    看上去像"打包坏了"。现在没有 zip 就用 CI 自己装好的 tex/ 现打一份。
          $zip = "AmTiKu-Windows-tex.zip"
          if (!(Test-Path $zip)) {
            if (!(Test-Path "tex\bin\windows\xelatex.exe")) {
              throw "既没有预装 zip，也没有 CI 装好的 tex\ —— 无法冒烟"
            }
            Write-Host "没有预装 zip：用 CI 装的 tex/ 现打一份（要 2~4 分钟）"
            Compress-Archive -Path "tex\*" -DestinationPath $zip -CompressionLevel Optimal
          }
          Expand-Archive $zip -DestinationPath dist\AmTiKu\tex -Force
          cd dist\AmTiKu
          .\AmTiKu.exe --selftest

      # ── 接口冒烟：把包当服务真跑起来，走一遍用户真会走的路 ─────────────
      # 只测 `--selftest` 不够：免安装版曾经「接口全通、首页 404」——
      # 前端被 PyInstaller 放进 `_internal/web/dist`，代码却去 exe 旁边找
      # `web/dist`，找不到就静默跳过整个界面挂载。用户第一步就是打开首页，
      # 于是只看到一个 404（这个 bug 就是这么抓出来的）。这条测试专门盯它。
      #
      # 跑**两遍**：先在原位（ASCII 路径）跑，再拷到「中文 + 空格」目录里跑。
      # 两遍结果一对比就能分清"是路径问题"还是"代码问题"——只跑一遍时
      # 分不清（上一轮就这么卡住的）。
      - name: 接口冒烟（原位 + 中文空格路径各一遍）
        shell: pwsh
        run: |
          $o = Join-Path $env:TEMP "amti_out.log"; $e = Join-Path $env:TEMP "amti_err.log"

          function Invoke-Smoke([string]$dir, [string]$tag, [int]$port) {
            Write-Host "════ 接口冒烟：$tag（$dir）════"
            # TeX 到底在不在、跑不跑得起来——先说清楚，省得再猜一轮
            $xe = Join-Path $dir "tex\bin\windows\xelatex.exe"
            Write-Host "  xelatex：存在=$(Test-Path $xe)"
            if (Test-Path $xe) {
              try { & $xe --version 2>&1 | Select-Object -First 2 | Write-Host }
              catch { Write-Host "  跑不起来：$($_.Exception.Message)" }
            }
            $p = Start-Process -FilePath (Join-Path $dir "AmTiKu.exe") `
                  -ArgumentList "--port",$port -PassThru `
                  -RedirectStandardOutput $o -RedirectStandardError $e
            try {
              python packaging/win_smoke_api.py --port $port
              $code = $LASTEXITCODE
            } finally {
              # 先停进程再读日志：stdout 重定向到文件是**块缓冲**的，
              # 不停掉就读等于什么都读不到（上一轮服务输出一片空白就是这个原因）
              Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
              Start-Sleep -Milliseconds 500
              Write-Host "──── $tag 的服务输出 ────"
              Get-Content $o -Tail 25 -ErrorAction SilentlyContinue
              Get-Content $e -Tail 25 -ErrorAction SilentlyContinue
            }
            return $code
          }

          $c1 = Invoke-Smoke "dist\AmTiKu" "原位（ASCII 路径）" 8951
          $dir = "D:\冒烟 测试\AmTiKu"
          New-Item -ItemType Directory -Force -Path (Split-Path $dir) | Out-Null
          Copy-Item dist\AmTiKu $dir -Recurse -Force
          $c2 = Invoke-Smoke $dir "中文+空格路径" 8952

          Write-Host "结果：原位 exit=$c1 ｜ 中文空格 exit=$c2"
          if ($c1 -ne 0 -or $c2 -ne 0) { throw "接口冒烟失败（上面有具体哪一项）" }

      # 用户拿到手的应该是**一个**文件，不是一个文件夹。
      # 打包前先断言关键部件都在——上一版把 tex 漏在包外的后果是
      # 「双击能打开、一导出就说找不到 xelatex」，比直接报错更难查。
      - name: 打成 zip
        id: pack
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $name = "AmTiKu-$v-Windows-x64"
          if (!(Test-Path "dist\AmTiKu\tex\bin\windows\xelatex.exe")) {
            throw "包里没有 tex\bin\windows\xelatex.exe —— 内置 LaTeX 没打进去"
          }
          if (!(Test-Path "dist\AmTiKu\_internal\web\dist\index.html")) {
            throw "包里没有前端 index.html —— 打出来的会是「接口能用、界面 404」"
          }
          Compress-Archive -Path "dist\AmTiKu\*" -DestinationPath "$name.zip" -CompressionLevel Optimal
          $mb = [math]::Round((Get-Item "$name.zip").Length / 1MB)
          Write-Host "产物：$name.zip（$mb MB）"
          "zip=$name.zip" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT

      # if: always() 很关键：以前任何一步失败就什么都取不回来（白等一轮）。
      # 现在无论成败都上传，至少能拿到 exe 与已装好的 TeX。
      - name: 上传产物（exe）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AmTiKu-Windows-exe
          path: dist/AmTiKu/**
          if-no-files-found: warn

      - name: 上传产物（内置 TeX）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AmTiKu-Windows-tex
          path: tex/**
          if-no-files-found: warn

      # 打 tag 时直接发到 Releases：用户点链接就能下，不用登 GitHub 取 artifact
      # （artifact 要登录、还有 90 天过期，不适合当交付物）。
      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.zip }}
          name: AmTiKu v${{ steps.ver.outputs.version }}
          body: |
            **AmTiKu v${{ steps.ver.outputs.version }}** · 双平台免安装版

            * `AmTiKu-${{ steps.ver.outputs.version }}-Windows-x64.zip` — 解压到**纯英文路径**，
              双击 `AmTiKu.exe`。自带 Python、LaTeX、前端，**不需要额外安装任何东西**。
            * macOS 版见同一 Release 的 `.dmg` 资产。

            不含题库，只有 4 道自编示例题；要接自己的题库，见 README。
            首次启动 Windows 可能弹「Windows 保护了你的电脑」——点「更多信息 → 仍要运行」。
